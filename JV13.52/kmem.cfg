# kmemdump v10 config -> copy to USB root as /mnt/usb0/kmem.cfg
#
# Window 1: widen outward from the region v9 ALREADY PROVED readable
# (kbase+0x02680000 .. 0x026A0000). 4 MiB centred on it.
# start/end are kbase-RELATIVE (no abs= line => addrbase = kbase).
#
# chunk is left at 0x1000 here on purpose -- v10 clamps it to whatever the
# ladder proves safe, so the ladder result governs. Do not raise this until
# the ladder line tells us we can.

start=0x02400000
end=0x02800000
chunk=0x00001000

# --- after window 1 succeeds, walk outward in 4 MiB steps ---
#   start=0x02000000  end=0x02400000
#   start=0x01c00000  end=0x02000000
#   ... etc down to 0x0
# then upward:
#   start=0x02800000  end=0x02c00000
#   ...
# Targets to cover: the kernel image is 0x14a65e8 bytes (read from the SELF
# program header), load vaddr 0x680000. Whole-image dump is the goal; each
# window is independent and resumable, so a softlock costs one window only.
